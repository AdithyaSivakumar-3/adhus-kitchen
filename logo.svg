<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#e8961e"/>
    </linearGradient>
  </defs>
  <style>
    .ring{transform-box:fill-box;transform-origin:center;animation:stir 5s ease-in-out infinite}
    @keyframes stir{0%,64%,100%{transform:rotate(0deg)}74%{transform:rotate(9deg)}84%{transform:rotate(-7deg)}92%{transform:rotate(3deg)}}
    .cap{transform-box:fill-box;transform-origin:50% 92%;animation:tip 5s ease-in-out infinite}
    @keyframes tip{0%,60%,100%{transform:rotate(0deg) translateY(0)}68%{transform:rotate(-14deg) translateY(-4px)}76%{transform:rotate(8deg) translateY(-1px)}84%{transform:rotate(-4deg) translateY(-2px)}92%{transform:rotate(0deg) translateY(0)}}
    .aa{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
    @keyframes pulse{0%,58%,100%{transform:scale(1)}70%{transform:scale(1.14)}80%{transform:scale(0.97)}88%{transform:scale(1.05)}}
  </style>
  <g class="ring">
    <path d="M22.2 81.8 A48 48 0 0 1 94 44.4" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M113.5 65.7 A48 48 0 0 1 30.7 113.5" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="92" y1="45.5" x2="103" y2="37" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(108,32.5) rotate(35)">
      <path d="M-9 1 h18 v-5.5 h-18 z" fill="#e8961e"/>
      <g stroke="#e8961e" stroke-width="3.4" stroke-linecap="round">
        <line x1="-7.3" y1="-4.5" x2="-7.3" y2="-17"/>
        <line x1="-2.4" y1="-4.5" x2="-2.4" y2="-19.5"/>
        <line x1="2.4" y1="-4.5" x2="2.4" y2="-19.5"/>
        <line x1="7.3" y1="-4.5" x2="7.3" y2="-17"/>
      </g>
    </g>
    <ellipse cx="32.9" cy="119.5" rx="13.5" ry="9.5" transform="rotate(48 32.9 119.5)" fill="url(#gold)"/>
  </g>
  <text class="aa" x="70" y="104" text-anchor="middle" font-family="'Noto Sans Tamil','Nirmala UI',serif" font-size="50" font-weight="700" fill="#d98e0b">ஆ</text>
  <g class="cap">
    <g transform="translate(70,36) scale(1.3)" stroke="#e8961e" stroke-width="2.8" stroke-linejoin="round">
      <ellipse cx="-10.5" cy="-6.5" rx="9" ry="7.5" fill="#fdf6ea"/>
      <ellipse cx="10.5" cy="-6.5" rx="9" ry="7.5" fill="#fdf6ea"/>
      <ellipse cx="0" cy="-11" rx="10.5" ry="9" fill="#fdf6ea"/>
      <path d="M-13 -2.5 h26 a3 3 0 0 1 3 3 v2.5 a3 3 0 0 1 -3 3 h-26 a3 3 0 0 1 -3 -3 v-2.5 a3 3 0 0 1 3 -3 z" fill="#fdf6ea"/>
    </g>
  </g>
</svg>
